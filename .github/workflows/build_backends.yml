      - name: Build backend
        run: |
          cd StraussModule/python_core
          pyinstaller --onedir --name StraussBackend server.py

      - name: Upload Linux backend
        uses: actions/upload-artifact@v4
        with:
          name: StraussBackend-linux
          path: StraussModule/python_core/dist/StraussBackend


  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
